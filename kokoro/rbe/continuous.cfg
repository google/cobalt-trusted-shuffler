# -*- protobuffer -*-
# proto-file: google3/devtools/kokoro/config/proto/build.proto
# proto-message: BuildConfig

build_file: "trusted-shuffler/kokoro/rbe/kokoro_build.sh"
container_properties {
  docker_image: "us-docker.pkg.dev/artifact-foundry-prod/docker-3p-trusted/ubuntu:22.04"
}
bazel_setting {
  project_id: "cobalt-tee-shuffler"
  # Do not change unless you know what you are doing.
  bes_backend_address: "buildeventservice.googleapis.com"
  foundry_backend_address: "remotebuildexecution.googleapis.com"
  upsalite_frontend_address: "https://source.cloud.google.com"
  # For debugging issues without using Foundry, uncomment below.
  # local_execution: true
}
gfile_resources: "/x20/teams/bazel/releases/bazel-8.5.1-linux-x86_64"
fileset_artifacts {
  name: "build_info"
  artifact_globs: "bazel_invocation_ids.txt"
  error_if_missing: true
  destinations {
    placer {}
  }
}
fileset_artifacts {
  name: "simple_container"
  artifact_globs: "binaries/simple_container/oci_runtime_bundle.tar"
  error_if_missing: true
  destinations {
    placer {}
  }
}

