name: Build release binaries

on:
  push:
    branches: [main]

jobs:
  # Run a Bazel build and upload the resulting container runtime bundles.
  build:
    permissions:
      contents: read

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libxml2
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Build
        run: |
          bazelisk run -c opt --curses=no --noshow_progress //:install_release_binaries -- --destdir="${{ runner.temp }}/binaries"
      - name: Print SHA-256 digests
        run: |
          set -euo pipefail
          cd "${{ runner.temp }}/binaries"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          sha256sum */oci_runtime_bundle.tar | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: ${{ runner.temp }}/binaries/
          if-no-files-found: error
          retention-days: 5
