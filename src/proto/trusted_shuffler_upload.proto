syntax = "proto3";

package cobalt.trusted_shuffler;

option java_package = "com.google.cobalt.trustedshuffler";
option java_multiple_files = true;
option java_outer_classname = "TrustedShufflerUploadProto";

// A single upload entry logged by a device for the Trusted Shuffler. Devices
// upload these in Federated Compute checkpoints (as the "upload_query/entry"
// tensor), and a single checkpoint may contain many entries.
message TrustedShufflerUpload {
  // A unique identifier for the project.
  int32 project_id = 1;

  // A unique identifier for the metric, namespaced under the project_id.
  int32 metric_id = 2;

  // The serialized customer message.
  bytes serialized_payload = 3;
}
