syntax = "proto3";

package cobalt.trusted_shuffler;

// Configuration specifying filtering and batching parameters for a trusted
// shuffler processing run.
message RunConfig {
  // Uniquely identifies a Cobalt metric by project and metric ID.
  message MetricIdentifier {
    // Unique ID of the project owning the metric.
    int32 project_id = 1;

    // Unique ID of the metric within the project.
    int32 metric_id = 2;
  }

  // Only metrics with identifiers in this list will be processed.
  repeated MetricIdentifier metric_identifiers = 1;

  // Only logs in this epoch range (inclusive) will be processed.
  int64 min_epoch_index = 2;
  int64 max_epoch_index = 3;

  // Number of logs to be processed per batch.
  int32 target_batch_size = 4;
}

// Execution context generated for a specific run, containing secret keys and
// the associated run configuration.
message RunContext {
  // 32-byte cryptographically secure random unique identifier for this run.
  bytes run_id = 1 [debug_redact = true];

  // 32-byte secret key generated in a cryptographically secure manner, used to
  // hash incoming data.
  bytes run_hash_key = 2 [debug_redact = true];

  // Configuration provided for this run.
  RunConfig run_config = 3;

  // Serialized Tink AES-256-GCM AEAD keyset (ProtoKeysetFormat) generated in a
  // cryptographically secure manner, used to encrypt output messages for
  // release.
  bytes release_key = 4 [debug_redact = true];
}

// Message containing a serialized `RunContext` alongside a cryptographic
// signature verifying its authenticity and integrity.
message SignedRunContext {
  // Serialized bytes of the `RunContext` protocol buffer message.
  bytes serialized_run_context = 1;

  // Cryptographic signature over `serialized_run_context` generated using the
  // container's signing key.
  bytes signature = 2;
}

