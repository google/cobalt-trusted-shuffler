syntax = "proto3";

package cobalt.trusted_shuffler;

option java_package = "com.google.cobalt.trustedshuffler";
option java_multiple_files = true;
option java_outer_classname = "OutputKeyProto";

// Identifies the types of output generated by the counter transform.
message OutputKey {
  // Type of the output data.
  enum OutputType {
    OUTPUT_TYPE_UNSPECIFIED = 0;
    // Indicates the output is the final CountReport.
    REPORT = 1;
    // Indicates the output is an individual message being passed through.
    MESSAGE = 2;
  }

  // The type of this output key. This tells the orchestrator how to interpret
  // and process the associated blob.
  OutputType type = 1;
}