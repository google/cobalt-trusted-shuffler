syntax = "proto3";

package cobalt.trusted_shuffler;

import "src/proto/common.proto";

option java_package = "com.google.cobalt.trustedshuffler";
option java_multiple_files = true;
option java_outer_classname = "ScatterShuffleProto";

// Identifies the target gather group for a scattered message by its partition
// key and within-partition group index.
message ScatterGroupKey {
  // Partition identifier for routing scattered records to per-partition gather
  // groups.
  MetricEpochKey metric_epoch_key = 1;

  // Assigned group identifier within the partition.
  int32 group_id = 2;
}

// Header metadata associated with records emitted by ScatterShuffleFn.
message ScatterShuffleHeader {
  oneof header_type {
    // Signals an integrity violation or validation failure.
    IntegrityFault integrity_fault = 1;

    // Target gather group key for a successfully shuffled record.
    ScatterGroupKey scatter_group_key = 2;
  }
}
