syntax = "proto3";

package cobalt.trusted_shuffler;

// Signals an integrity violation or validation failure detected during payload processing.
message IntegrityFault {}

// Uniquely identifies a metric data partition by project, metric, and epoch
// index.
message MetricEpochKey {
  // Unique ID of the project owning the metric.
  int32 project_id = 1;

  // Unique ID of the metric within the project.
  int32 metric_id = 2;

  // Epoch index associated with the metric data.
  int64 epoch_index = 3;
}

// Represents a message being processed by the Trusted Shuffler pipeline.
message ShuffledMessage {
  // Partition key identifying project, metric, and epoch index.
  MetricEpochKey metric_epoch_key = 1;

  // 32-byte run identifier for the processing execution context.
  bytes run_id = 2;

  // Group messages are assigned to in the 2nd shuffling phase.
  int32 group_id = 3;

  // Whether a message from the first shuffling stage is padding.
  bool is_padding = 4;

  // Number of times a message is processed by a shuffling stage.
  int32 shuffle_count = 5;

  // Customer message payload.
  bytes customer_message = 7;
}
