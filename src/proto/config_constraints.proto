syntax = "proto3";

package cobalt.trusted_shuffler;

option java_package = "com.google.cobalt.trustedshuffler";
option java_multiple_files = true;
option java_outer_classname = "ConfigConstraintsProto";

// Represents a single metric and its reporting threshold within a project.
message MetricThreshold {
  // Globally unique ID identifying the project owning the metric.
  int32 project_id = 1;

  // Per-project unique ID identifying the metric.
  int32 metric_id = 2;

  // Reporting threshold for the metric. Must be positive.
  int32 threshold = 3;
}

// Config constraints for sted Shuffler specifying allowed metrics and
// thresholds for a pipeline.
message TrustedShufflerConfigConstraints {
  // List of metric thresholds allowed to be processed by the trusted shuffler.
  repeated MetricThreshold metric_thresholds = 1;
}
